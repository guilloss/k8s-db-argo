# Secrets à préciser:
#  SCW_SECRET_KEY : clé pour Scaleway
#  SCW_PROJECT_ID : identifiant du projet Scaleway
#  SCW_ACCESS_KEY : identifiant d'accès pour Scaleway
#  DIGITALOCEAN_TOKEN : Token DigitalOcean (DNS)
#  PA_TOKEN : token Github Actions
#
on: workflow_dispatch
name: 01-create_cluster
jobs:
  k8s-init:
    name: 01-01 - Initalisation du cluster k8s avec Terraform
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true
      TF_CLI_ARGS: "-no-color"
      TF_VAR_pa_toke,: ${{ secrets.PA_TOKEN }}
      TF_VAR_scw_access_key: ${{ secrets.SCW_ACCESS_KEY }}
      TF_VAR_scw_secret_key: ${{ secrets.SCW_SECRET_KEY }}
      TF_VAR_scw_project_id: ${{ secrets.SCW_PROJECT_ID }}
      TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    steps:
    - name: Récupération du repository
      uses: actions/checkout@master
    - name: Configuration de Terraform
      uses: hashicorp/setup-terraform@v2
    - name: Init Terraform
      run:
        terraform -chdir=terraform init -backend-config=../config/cluster-backend.tfvars \
          -backend-config="access_key = ${{secrets.SCW_ACCESS_KEY}}" \
          -backend-config="secret_key = ${{secrets.SCW_SECRET_KEY}}"
    - name: Exécution du script Terraform
      run:
        terraform -chdir=terraform apply --auto-approve -var-file="../config/cluster.tfvars"
    - name: Récupération du contenu du fichier de configuration Kubeconfig
      id: read_kubeconfig
      run: |
        KUBECONFIG_CONTENT=$(cat ./terraform/kubeconfig)
        echo "::set-output name=kubeconfig::$KUBECONFIG_CONTENT"
    - name: Mise à jour du secret
      uses: gliech/create-github-secret-action@v1
      with:
        name: KUBE_CONFIG_DATA
        value: "${{ steps.read_kubeconfig.outputs.kubeconfig }}"
        pa_token: ${{ secrets.PA_TOKEN }}